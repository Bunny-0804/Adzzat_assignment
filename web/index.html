<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azzdat CobolCraft RL Benchmark Showcase</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --badge-bg: rgba(56, 139, 253, 0.15);
            --badge-border: rgba(56, 139, 253, 0.4);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --border-color: #d0d7de;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-muted: #8c959f;
            --accent-blue: #0969da;
            --accent-green: #1a7f37;
            --accent-orange: #9a6700;
            --accent-red: #cf222e;
            --badge-bg: rgba(9, 105, 218, 0.1);
            --badge-border: rgba(9, 105, 218, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .tag-banner {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--accent-blue);
            text-transform: uppercase;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent-blue);
        }

        .layout-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 61px);
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .task-list {
            list-style: none;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-item {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease-in-out;
            background: transparent;
        }

        .task-item:hover {
            background-color: var(--bg-tertiary);
            border-color: var(--border-color);
        }

        .task-item.active {
            background-color: var(--bg-tertiary);
            border-color: var(--accent-blue);
        }

        .task-item-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .task-item-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Detail Pane */
        .detail-pane {
            flex: 1;
            overflow-y: auto;
            padding: 32px 48px;
            background-color: var(--bg-primary);
        }

        .detail-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 28px;
        }

        .detail-id {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-blue);
            margin-bottom: 6px;
        }

        .detail-title {
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }

        .task-header-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid transparent;
        }

        .badge-category {
            background-color: var(--badge-bg);
            border-color: var(--badge-border);
            color: var(--accent-blue);
        }

        .badge-difficulty-medium-hard {
            background-color: rgba(210, 153, 34, 0.15);
            border-color: rgba(210, 153, 34, 0.4);
            color: var(--accent-orange);
        }

        .badge-difficulty-hard {
            background-color: rgba(248, 81, 73, 0.15);
            border-color: rgba(248, 81, 73, 0.4);
            color: var(--accent-red);
        }

        .badge-timeout {
            background-color: var(--bg-tertiary);
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .callout-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 28px;
        }

        .callout-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .callout-content {
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .section-block {
            margin-bottom: 32px;
        }

        .section-heading {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .content-body {
            font-size: 0.92rem;
            line-height: 1.68;
            color: var(--text-secondary);
            font-family: var(--font-family);
        }

        .pre-wrap {
            white-space: pre-wrap;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            font-family: var(--font-family);
            color: var(--text-primary);
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-action {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
    </style>
</head>
<body data-theme="dark">
    <header>
        <div class="header-title">
            <h1>Azzdat Harbor RL Benchmark Showcase</h1>
            <span class="tag-banner">CobolCraft Suite</span>
        </div>
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">☀️ Light Mode</button>
    </header>

    <div class="layout-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">Benchmark Tasks</div>
            <ul class="task-list" id="taskList">
                <!-- Dynamically populated via safe DOM creation -->
            </ul>
        </aside>

        <!-- Main Detail Pane -->
        <main class="detail-pane" id="detailPane">
            <div id="loading" style="color: var(--text-secondary); padding: 40px;">Loading tasks...</div>
        </main>
    </div>

    <script>
        let allTasks = [];
        let activeTaskId = null;

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
            localStorage.setItem('theme', next);
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        async function fetchTasks() {
            const isFileProtocol = window.location.protocol === 'file:';
            const apiUrl = isFileProtocol ? 'http://localhost:8000/api/tasks' : '/api/tasks';

            try {
                const res = await fetch(apiUrl);
                allTasks = await res.json();
                renderTaskList();
                if (allTasks.length > 0) {
                    selectTask(allTasks[0].id);
                }
            } catch (err) {
                const pane = document.getElementById('detailPane');
                pane.replaceChildren();

                const errBox = document.createElement('div');
                errBox.style.padding = '24px';
                errBox.style.maxWidth = '600px';

                const errTitle = document.createElement('h3');
                errTitle.style.color = 'var(--accent-red)';
                errTitle.style.marginBottom = '8px';
                errTitle.textContent = 'Backend Server Not Reachable';

                const errMsg = document.createElement('p');
                errMsg.style.color = 'var(--text-secondary)';
                errMsg.style.fontSize = '0.92rem';
                errMsg.textContent = `Could not connect to ${apiUrl}: ${err.message}`;

                errBox.append(errTitle, errMsg);

                if (isFileProtocol) {
                    const helpBox = document.createElement('div');
                    helpBox.style.marginTop = '16px';
                    helpBox.style.background = 'var(--bg-secondary)';
                    helpBox.style.border = '1px solid var(--border-color)';
                    helpBox.style.borderRadius = '8px';
                    helpBox.style.padding = '18px';
                    helpBox.style.color = 'var(--text-primary)';

                    const helpTitle = document.createElement('h4');
                    helpTitle.style.marginBottom = '8px';
                    helpTitle.style.color = 'var(--accent-blue)';
                    helpTitle.textContent = 'How to start the backend showcase server:';

                    const helpP = document.createElement('p');
                    helpP.style.marginBottom = '10px';
                    helpP.style.color = 'var(--text-secondary)';
                    helpP.style.fontSize = '0.9rem';
                    helpP.textContent = 'Opening directly via file:/// cannot serve tasks dynamically without the Python process running.';

                    const ol = document.createElement('ol');
                    ol.style.marginLeft = '20px';
                    ol.style.lineHeight = '1.8';
                    ol.style.fontSize = '0.9rem';

                    const li1 = document.createElement('li');
                    li1.textContent = 'Run command in terminal: python adzzat-cobolcraft-tasks/web/server.py';

                    const li2 = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = 'http://localhost:8000';
                    link.target = '_blank';
                    link.style.color = 'var(--accent-blue)';
                    link.style.textDecoration = 'underline';
                    link.textContent = 'http://localhost:8000';
                    li2.append('Open ', link, ' in your browser');

                    ol.append(li1, li2);
                    helpBox.append(helpTitle, helpP, ol);
                    errBox.append(helpBox);
                }

                pane.append(errBox);
            }
        }

        function renderTaskList() {
            const listEl = document.getElementById('taskList');
            listEl.replaceChildren();

            allTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.id === activeTaskId ? 'active' : ''}`;
                li.id = `item-${task.id}`;
                li.onclick = () => selectTask(task.id);

                const titleEl = document.createElement('div');
                titleEl.className = 'task-item-title';
                titleEl.textContent = task.title;

                const badgesEl = document.createElement('div');
                badgesEl.className = 'task-item-badges';

                const catBadge = document.createElement('span');
                catBadge.className = 'badge badge-category';
                catBadge.textContent = task.category;

                const diffBadge = document.createElement('span');
                diffBadge.className = `badge ${task.difficulty.includes('medium') ? 'badge-difficulty-medium-hard' : 'badge-difficulty-hard'}`;
                diffBadge.textContent = task.difficulty;

                badgesEl.append(catBadge, diffBadge);
                li.append(titleEl, badgesEl);
                listEl.appendChild(li);
            });
        }

        function selectTask(taskId) {
            activeTaskId = taskId;
            document.querySelectorAll('.task-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`item-${taskId}`);
            if (activeEl) activeEl.classList.add('active');

            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;

            const pane = document.getElementById('detailPane');
            pane.replaceChildren();

            // Header
            const header = document.createElement('div');
            header.className = 'detail-header';

            const idEl = document.createElement('div');
            idEl.className = 'detail-id';
            idEl.textContent = `task: ${task.id}`;

            const titleEl = document.createElement('h2');
            titleEl.className = 'detail-title';
            titleEl.textContent = task.title;

            const headerBadges = document.createElement('div');
            headerBadges.className = 'task-header-badges';

            const catBadge = document.createElement('span');
            catBadge.className = 'badge badge-category';
            catBadge.textContent = task.category;

            const diffBadge = document.createElement('span');
            diffBadge.className = `badge ${task.difficulty.includes('medium') ? 'badge-difficulty-medium-hard' : 'badge-difficulty-hard'}`;
            diffBadge.textContent = `Difficulty: ${task.difficulty}`;

            const verifierBadge = document.createElement('span');
            verifierBadge.className = 'badge badge-timeout';
            verifierBadge.textContent = `Verifier: ${task.verifier_timeout_sec}s`;

            const agentBadge = document.createElement('span');
            agentBadge.className = 'badge badge-timeout';
            agentBadge.textContent = `Agent: ${task.agent_timeout_sec}s`;

            headerBadges.append(catBadge, diffBadge, verifierBadge, agentBadge);
            header.append(idEl, titleEl, headerBadges);

            // Technical Callout (difficulty_note)
            const callout = document.createElement('div');
            callout.className = 'callout-box';

            const calloutTitle = document.createElement('div');
            calloutTitle.className = 'callout-title';
            calloutTitle.textContent = 'Technical Root-Cause & Systems Note';

            const calloutContent = document.createElement('div');
            calloutContent.className = 'callout-content';
            calloutContent.textContent = task.difficulty_note;

            callout.append(calloutTitle, calloutContent);

            // Statement Section
            const statementSec = document.createElement('div');
            statementSec.className = 'section-block';

            const statementHeading = document.createElement('h3');
            statementHeading.className = 'section-heading';
            statementHeading.textContent = 'Task Statement';

            const statementBody = document.createElement('pre');
            statementBody.className = 'content-body pre-wrap';
            statementBody.textContent = task.statement;

            statementSec.append(statementHeading, statementBody);

            // Environment Section
            const envSec = document.createElement('div');
            envSec.className = 'section-block';

            const envHeading = document.createElement('h3');
            envHeading.className = 'section-heading';
            envHeading.textContent = 'Execution Environment';

            const envBody = document.createElement('pre');
            envBody.className = 'content-body pre-wrap';
            envBody.textContent = task.environment;

            envSec.append(envHeading, envBody);

            // Action Buttons
            const actionBar = document.createElement('div');
            actionBar.className = 'action-bar';

            const copyNopBtn = document.createElement('button');
            copyNopBtn.className = 'btn-action';
            copyNopBtn.textContent = '📋 Copy Harbor NOP Command';
            copyNopBtn.onclick = () => copyHarborCmd(task.id);

            const copyOracleBtn = document.createElement('button');
            copyOracleBtn.className = 'btn-action';
            copyOracleBtn.textContent = '⚡ Copy Harbor Oracle Command';
            copyOracleBtn.onclick = () => copyOracleCmd(task.id);

            actionBar.append(copyNopBtn, copyOracleBtn);

            pane.append(header, callout, statementSec, envSec, actionBar);
        }

        function copyHarborCmd(id) {
            const cmd = `harbor run -p ./tasks/${id} -a nop`;
            navigator.clipboard.writeText(cmd);
            alert(`Copied to clipboard:\n${cmd}`);
        }

        function copyOracleCmd(id) {
            const cmd = `harbor run -p ./tasks/${id} -a oracle`;
            navigator.clipboard.writeText(cmd);
            alert(`Copied to clipboard:\n${cmd}`);
        }

        fetchTasks();
    </script>
</body>
</html>
