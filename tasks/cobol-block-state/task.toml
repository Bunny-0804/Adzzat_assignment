version = "1.0"

[metadata]
id = "cobol-block-state"
title = "Resolve Multi-Block Interaction State Corruption"
category = "language-driven"
difficulty = "medium-hard"
difficulty_note = "Medium-Hard (Language-driven): Tests GnuCOBOL memory semantics where LINKAGE SECTION parameters are passed by reference and mutated in place across callback boundaries, while WORKING-STORAGE SECTION buffers persist statically across CALL invocations instead of isolating per-call state in LOCAL-STORAGE SECTION."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
